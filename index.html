<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandstem</title>
<meta name="description" content="Stem samen op de nummers uit jullie Spotify-playlist.">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='28' height='14' rx='2' fill='%23f2d64b' transform='rotate(-6 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="top" hidden>
  <div class="wrap">
    <div class="toprow">
      <span class="logo">Bandstem</span>
      <div class="me" id="me"></div>
    </div>
    <div class="playlist" id="playlist"></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-stemmen" aria-selected="true">Stemmen</button>
      <button class="tab" role="tab" id="tab-resultaten" aria-selected="false">Resultaten</button>
      <button class="tab" role="tab" id="tab-spelen" aria-selected="false">We spelen</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <p class="muted">Laden…</p>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
